pointcloud_to_laserscan:
  ros__parameters:
    target_frame: laser
    transform_tolerance: 0.2
    # Slice band ~7-15cm above floor (laser origin ~15cm). max_height 0.00 keeps it
    # BELOW the 20cm middle-box step (two stacked boxes of different width above 20cm
    # tangled the inner wall). Catches the round hose near its widest (~15cm).
    min_height: -0.08
    max_height: 0.00
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.1
    range_min: 0.30
    range_max: 2.5
    use_inf: true
